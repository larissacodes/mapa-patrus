<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda da campanha Patrus 13</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23D7141A'/><text x='50' y='70' font-size='56' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'>13</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    /* Paleta da campanha */
    --vermelho:#D7141A; --vermelho-escuro:#A50E13; --vinho:#5E0A0F;
    --rosa:#FBE3E4; --papel:#FFFFFF; --fundo:#F4F3F3; --linha:#E4E0E0;
    --tinta:#1F1A1A; --cinza:#6E6464;
    /* Cores por tipo de atividade (mudar aqui muda mapa, legenda e cards) */
    --t-visita:#D7141A; --t-ato:#5E0A0F; --t-bandeira:#E8A200;
    --t-banca:#EE7B6D; --t-encontro:#3F4A63;
    --cond:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
    --texto:'Barlow',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:var(--texto);color:var(--tinta);background:var(--fundo)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--vinho);outline-offset:2px}

  #app{display:flex;height:100vh;overflow:hidden}

  /* ---------- Painel (metade esquerda) ---------- */
  #painel{width:50%;min-width:0;display:flex;flex-direction:column;background:var(--papel);
          border-right:1px solid var(--linha);z-index:500}
  .topo{padding:16px 24px 14px;border-bottom:1px solid var(--linha);display:flex;align-items:center;
        justify-content:space-between;flex-wrap:wrap;gap:12px 18px}
  .topo-titulo{flex:1 1 250px;min-width:0}
  /* Cola com os números da chapa: contorno vermelho, fundo branco.
     Para mudar a cor de um card, use style="--c:#hex" no <li> */
  .cola{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex:none}
  .num{--c:var(--vermelho);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
       min-width:68px;padding:6px 9px 7px;border:2px solid var(--c);border-radius:12px;background:#fff;
       color:var(--c);text-align:center}
  .num .digito{font-family:var(--cond);font-weight:800;font-size:30px;line-height:.95;letter-spacing:.5px;color:var(--c)}
  /* números vazados: miolo branco e contorno vermelho (navegadores sem suporte mostram o número cheio) */
  @supports (-webkit-text-stroke:1px black){
    .num .digito{color:#fff;-webkit-text-stroke:1.5px var(--c)}
  }
  .num .quem{font-size:10.5px;line-height:1.15;color:var(--c);white-space:nowrap}
  .num .quem strong{display:block;font-size:12.5px;font-weight:600}
  .topo h1{margin:0;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.05;letter-spacing:.1px}
  .topo p{margin:4px 0 0;font-size:13.5px;color:var(--cinza)}

  .painel-corpo{flex:1;min-height:0;display:grid;grid-template-columns:1fr;overflow-y:auto}
  .col-cal{padding:18px 24px 8px;min-width:0}
  .col-lista{min-width:0}
  .col-lista{padding:8px 24px 24px}

  /* Calendário: o bloco forte da página */
  .cal{background:var(--vermelho);color:#fff;border-radius:16px;padding:14px 12px 12px;container-type:inline-size}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .cal-nav h2{margin:0;font-family:var(--cond);font-weight:700;font-size:clamp(19px,7cqi,24px)}
  .cal-nav button{width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);
          background:transparent;color:#fff;cursor:pointer;font-size:18px;line-height:1}
  .cal-nav button:hover{background:rgba(255,255,255,.14)}
  .cal-nav button:disabled{opacity:.3;cursor:default;background:transparent}
  /* minmax(0,1fr) deixa as colunas encolherem de verdade em vez de empurrar o calendário para fora */
  .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:clamp(2px,1.2cqi,5px)}
  .cal-sem{font-family:var(--cond);font-weight:600;font-size:13px;text-align:center;opacity:.75;padding:2px 0 4px}
  .dia{position:relative;aspect-ratio:1/1;min-width:0;border-radius:clamp(6px,2.6cqi,10px);border:none;background:transparent;
       color:rgba(255,255,255,.45);font-family:var(--cond);font-weight:600;font-size:clamp(14px,5.6cqi,20px);cursor:default;
       display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
  .dia.vazio{visibility:hidden}
  .dia.tem{color:#fff;cursor:pointer;background:rgba(255,255,255,.1)}
  .dia.tem:hover{background:rgba(255,255,255,.22)}
  .dia.hoje{box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
  .dia.sel{background:#fff;color:var(--vermelho)}
  .dia .qtd{font-family:var(--texto);font-weight:600;font-size:clamp(8.5px,3cqi,11px);line-height:1;margin-top:2px;opacity:.9}
  .dia .estrela{position:absolute;top:2px;right:3px;font-size:clamp(8px,2.8cqi,10px);line-height:1}
  .cal-rodape{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px;font-size:12.5px;gap:8px}
  .cal-rodape button{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:20px;
          padding:5px 12px;cursor:pointer;font-weight:600;font-size:12.5px}
  .cal-rodape button[aria-pressed="true"]{background:#fff;color:var(--vermelho)}
  .cal-rodape span{opacity:.85}

  /* Filtros */
  .filtros{margin-top:16px}
  .filtros summary{cursor:pointer;font-family:var(--cond);font-weight:700;font-size:19px;padding:4px 0 6px}
  .filtros h3{margin:14px 0 7px;font-size:13px;font-weight:600;color:var(--cinza)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--linha);background:#fff;border-radius:20px;
        padding:5px 11px;font-size:13px;cursor:pointer;user-select:none}
  .chip .bola{width:11px;height:11px;border-radius:50%;flex:none}
  .chip[aria-pressed="false"]{opacity:.38}
  .chip.status[aria-pressed="true"]{border-color:var(--tinta)}
  .patrus-toggle{display:flex;align-items:center;gap:10px;margin-top:4px;padding:10px 12px;border-radius:12px;
        background:var(--rosa);cursor:pointer;font-size:13.5px;font-weight:600;color:var(--vinho)}
  .patrus-toggle input{width:17px;height:17px;accent-color:var(--vermelho)}
  select{width:100%;padding:8px 10px;border:1.5px solid var(--linha);border-radius:10px;background:#fff;font:inherit;font-size:13.5px}
  .acoes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .acoes button{flex:1;min-width:110px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--linha);background:#fff;
        cursor:pointer;font-weight:600;font-size:13px}
  .acoes button:hover{border-color:var(--vermelho);color:var(--vermelho)}

  /* Lista do dia */
  .lista-topo{position:sticky;top:0;background:var(--papel);padding:10px 0 8px;z-index:2}
  .lista-topo h2{margin:0;font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.05}
  .lista-topo p{margin:3px 0 0;font-size:13px;color:var(--cinza)}
  #lista{list-style:none;margin:4px 0 0;padding:0}
  .grupo-dia{font-family:var(--cond);font-weight:700;font-size:17px;margin:16px 0 4px;color:var(--vermelho-escuro)}
  .ev{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--linha);cursor:pointer}
  .ev:hover .ev-titulo{color:var(--vermelho)}
  .ev.ativo{background:var(--rosa);margin:0 -10px;padding:11px 10px;border-radius:10px;border-top-color:transparent}
  .ev-hora{font-family:var(--cond);font-weight:700;font-size:18px;line-height:1.1}
  .ev-hora small{display:block;font-weight:500;font-size:13px;color:var(--cinza)}
  .ev-titulo{font-weight:600;font-size:14.5px;line-height:1.3}
  .ev-local{font-size:13px;color:var(--cinza);margin-top:2px;line-height:1.35}
  .ev-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--fundo);color:var(--tinta)}
  .tag.tipo{color:#fff}
  .tag.patrus{background:var(--vermelho);color:#fff}
  .tag.pendente{background:#FFF1CC;color:#6B4E00}
  .tag.realizada{background:#E7EFE9;color:#2E5C3E}
  .tag.semlocal{background:#fff;border:1px dashed var(--cinza);color:var(--cinza)}
  .vazio-msg{padding:22px 0;color:var(--cinza);font-size:14px}

  /* ---------- Mapa (metade direita) ---------- */
  #mapaWrap{position:relative;flex:1;min-width:0}
  #map{position:absolute;inset:0;background:#EDEBEB}
  .pin{--c:var(--t-banca);width:22px;height:22px;border-radius:50%;background:var(--c);border:2.5px solid #fff;
       box-shadow:0 1px 4px rgba(40,0,0,.35);display:grid;place-items:center;color:#fff;
       font-family:var(--cond);font-weight:700;font-size:12px;line-height:1}
  .pin.patrus{width:32px;height:32px;background:var(--vermelho);font-size:15px;border-width:3px}
  .pin.passado{opacity:.5}
  .pin.pendente{border-style:dashed}
  .pin.sel{box-shadow:0 0 0 4px rgba(215,20,26,.35),0 1px 4px rgba(40,0,0,.35)}
  .pin .n{position:absolute;top:-7px;right:-8px;min-width:17px;height:17px;border-radius:9px;background:var(--tinta);
       color:#fff;font-family:var(--texto);font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px}
  .leaflet-div-icon.pin-wrap{background:none;border:none}

  #foraBH{position:absolute;top:12px;right:12px;z-index:600;max-width:min(300px,calc(100% - 80px));
       background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 2px 10px rgba(40,0,0,.15);font-size:13px;display:none}
  #foraBH.on{display:block}
  #foraBH strong{display:block;font-size:12.5px;color:var(--cinza);font-weight:600;margin-bottom:5px}
  #foraBH button{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:none;background:none;
       padding:4px 0;cursor:pointer;font-weight:600;font-size:13.5px}
  #foraBH button:hover{color:var(--vermelho)}
  #foraBH .bola{width:10px;height:10px;border-radius:50%;flex:none}

  /* Card que abre ao clicar no mapa */
  #card{position:absolute;left:14px;bottom:14px;z-index:700;width:min(390px,calc(100% - 28px));max-height:calc(100% - 28px);
       overflow-y:auto;background:#fff;border-radius:16px;box-shadow:0 8px 28px rgba(40,0,0,.22);display:none}
  #card.on{display:block;animation:sobe .18s ease-out}
  @keyframes sobe{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){#card.on{animation:none}}
  .card-topo{position:sticky;top:0;background:var(--vermelho);color:#fff;padding:14px 48px 12px 16px;border-radius:16px 16px 0 0}
  .card-topo h2{margin:0;font-family:var(--cond);font-weight:700;font-size:22px;line-height:1.1}
  .card-topo p{margin:3px 0 0;font-size:12.5px;opacity:.9}
  .card-fechar{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;
       background:rgba(255,255,255,.18);color:#fff;cursor:pointer;font-size:18px;line-height:1}
  .card-fechar:hover{background:rgba(255,255,255,.32)}
  .card-ev{padding:13px 16px;border-top:1px solid var(--linha)}
  .card-ev:first-of-type{border-top:none}
  .card-ev.foco{background:var(--rosa)}
  .card-ev h3{margin:0;font-size:15px;line-height:1.3}
  .card-ev .quando{font-family:var(--cond);font-weight:700;font-size:16px;color:var(--vermelho-escuro);margin-bottom:3px}
  .card-ev dl{margin:8px 0 0;font-size:13px;line-height:1.45;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .card-ev dt{color:var(--cinza)}
  .card-ev dd{margin:0}
  .card-pe{padding:11px 16px 14px;border-top:1px solid var(--linha);font-size:12.5px;color:var(--cinza)}
  .card-pe a{color:var(--vermelho);font-weight:600}

  /* Crédito: no computador fica no canto de atribuição do mapa, no celular aparece no cabeçalho */
  .credito-topo{display:none;margin:3px 0 0;font-size:12px;color:var(--cinza)}
  .credito-topo a{color:inherit}
  .leaflet-control-attribution .credito{color:var(--tinta);font-weight:600}
  .leaflet-control-attribution .credito a{color:var(--vermelho-escuro);text-decoration:none}
  .leaflet-control-attribution .credito a:hover{text-decoration:underline}

  /* Painel largo: calendário e lista lado a lado */
  @media (min-width:1180px){
    .painel-corpo{grid-template-columns:minmax(340px,400px) minmax(0,1fr);overflow:hidden}
    /* scrollbar-gutter reserva o espaço da barra de rolagem (Windows) para ela não comer a lateral */
    .col-cal{overflow-y:auto;scrollbar-gutter:stable;border-right:1px solid var(--linha);padding:18px 18px 20px 24px}
    .col-lista{overflow-y:auto;padding-top:8px}
  }
  /* Celular: painel em cima, mapa embaixo, página rola */
  @media (max-width:520px){ .cola{width:100%} .num{flex:1;min-width:0;padding:6px 4px 7px} .num .quem{white-space:normal} }
  @media (max-width:820px){
    .credito-topo{display:block}
    .col-cal,.col-lista{padding-left:16px;padding-right:16px}
    .topo{padding:16px}
    #app{flex-direction:column;height:auto;overflow:visible}
    #painel{width:100%;border-right:none;border-bottom:1px solid var(--linha)}
    .painel-corpo{overflow:visible}
    #mapaWrap{height:70vh;flex:none}
    .lista-topo{position:static}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="painel">
    <header class="topo">
      <div class="topo-titulo">
        <h1>Agenda da campanha Patrus 13</h1>
        <p>Atividades de rua, caminhadas e visitas em Minas Gerais</p>
        <p class="credito-topo">Mapa por <a href="https://www.linkedin.com/in/larissadinizaguiar/" target="_blank" rel="noopener">Larissa Diniz Aguiar</a></p>
      </div>
      <ul class="cola" aria-label="Números da chapa">
        <li class="num" aria-label="Lula, presidente, 13"><span class="digito">13</span><span class="quem"><strong>Lula</strong>Presidente</span></li>
        <li class="num" aria-label="Patrus, governador, 13"><span class="digito">13</span><span class="quem"><strong>Patrus</strong>Governador</span></li>
        <li class="num" aria-label="Marília Campos, senadora, 131"><span class="digito">131</span><span class="quem"><strong>Marília</strong>Senadora</span></li>
        <li class="num" aria-label="Áurea Carolina, senadora pelo PSOL, 500"><span class="digito">500</span><span class="quem"><strong>Áurea</strong>Senadora, PSOL</span></li>
      </ul>
    </header>

    <div class="painel-corpo">
      <section class="col-cal" aria-label="Calendário e filtros">
        <div class="cal">
          <div class="cal-nav">
            <button id="mesAnt" aria-label="Mês anterior">‹</button>
            <h2 id="mesNome"></h2>
            <button id="mesProx" aria-label="Próximo mês">›</button>
          </div>
          <div class="cal-grid" id="calGrid" role="grid"></div>
          <div class="cal-rodape">
            <span>★ dia com agenda do Patrus</span>
            <button id="btnTodos" aria-pressed="false">Ver todos os dias</button>
          </div>
        </div>

        <details class="filtros" id="filtrosBox" open>
          <summary>Filtros</summary>
          <label class="patrus-toggle"><input type="checkbox" id="soPatrus"> Mostrar só agendas com o Patrus</label>
          <h3>Tipo de atividade</h3>
          <div class="chips" id="fTipos"></div>
          <h3>Situação</h3>
          <div class="chips" id="fStatus"></div>
          <h3>Frente ou regional</h3>
          <select id="fFrente"><option value="">Todas</option></select>
          <div class="acoes">
            <button id="verBH">Ver Belo Horizonte</button>
            <button id="verMG">Ver Minas Gerais</button>
            <button id="limpar">Limpar filtros</button>
          </div>
        </details>
      </section>

      <section class="col-lista" aria-live="polite">
        <div class="lista-topo">
          <h2 id="listaTitulo"></h2>
          <p id="listaResumo"></p>
        </div>
        <ol id="lista"></ol>
      </section>
    </div>
  </aside>

  <main id="mapaWrap">
    <div id="map" aria-label="Mapa das atividades"></div>
    <div id="foraBH"></div>
    <article id="card" aria-live="polite"></article>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

   DADOS
   Cada evento: data (AAAA-MM-DD), hora, atividade, local, municipio,
   lat/lng (null quando o local ainda não foi definido), precisao,
   tipo, frentes, diaD, patrus (true se o Patrus participa),
   status, responsavel, obs.
   precisao: "endereco" | "aproximada" | "regional" | "cidade" | "sem local"

,-14.874],[-46.003,-14.902],[-45.966,-14.965],[-45.975,-15.038],[-46.043,-15.118],[-46.049,-15.166],[-46.119,-15.192],[-46.077,-15.264],[-46.052,-15.259],[-46.028,-15.201],[-45.984,-15.196],[-45.953,-15.139],[-45.873,-15.157],[-45.825,-15.116],[-45.721,-15.112],[-45.566,-14.944],[-45.455,-14.953],[-45.317,-14.832],[-45.285,-14.832],[-45.205,-14.744],[-45.083,-14.749],[-45.039,-14.68],[-44.843,-14.58],[-44.858,-14.571],[-44.824,-14.539],[-44.833,-14.499],[-44.701,-14.449],[-44.688,-14.416],[-44.668,-14.423],[-44.658,-14.395],[-44.565,-14.34],[-44.487,-14.328],[-44.316,-14.24],[-44.247,-14.26],[-44.24,-14.24]]]}};

const TIPOS = {
  'Visita do Patrus':        'var(--t-visita)',
  'Caminhada e ato':         'var(--t-ato)',
  'Encontro e debate':       'var(--t-encontro)',
  'Bandeiraço e adesivaço':  'var(--t-bandeira)',
  'Banquinha e panfletagem': 'var(--t-banca)'
};
const ORDEM_TIPO = Object.keys(TIPOS);           // prioridade da cor quando há vários eventos no mesmo ponto
const STATUS = ['Programada','Pendente de confirmação','Realizada','Sem status'];
const NOTA_PRECISAO = {
  aproximada:'Ponto aproximado, pela referência do endereço.',
  regional:'Ponto no centro da regional, o local exato ainda não foi definido.',
  cidade:'Ponto no centro do município.'
};
const BH = [-19.9167,-43.9345];

/* ---------- Utilitários ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dataObj = iso => new Date(iso+'T12:00:00');
const fmtDia = (iso,op) => dataObj(iso).toLocaleDateString('pt-BR',op);
const hojeISO = (()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;})();
function minutos(h){
  if(!h) return 9999;
  if(/manh/i.test(h)) return 480;
  if(/tarde/i.test(h)) return 840;
  if(/noite/i.test(h)) return 1140;
  const m=h.match(/(\d{1,2}):(\d{2})/); return m? (+m[1])*60+(+m[2]) : 9999;
}
function distKm(a,b){ // distância aproximada entre dois pontos [lat,lng]
  const R=6371,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLng=(b[1]-a[1])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
EVENTOS.forEach((e,i)=>{ e.id=i; e.min=minutos(e.hora); });
EVENTOS.sort((a,b)=> a.data.localeCompare(b.data) || a.min-b.min);

/* ---------- Estado ---------- */
const diasComEvento = [...new Set(EVENTOS.map(e=>e.data))].sort();
const estado = {
  dia: null,                     // null = todos os dias
  mes: null,                     // 'AAAA-MM' exibido no calendário
  tiposOff: new Set(),
  statusOff: new Set(),
  soPatrus: false,
  frente: '',
  cardChave: null,               // ponto aberto no card
  eventoFoco: null
};
// dia inicial: hoje, se houver agenda; senão o próximo dia com agenda; senão todos
estado.dia = diasComEvento.includes(hojeISO) ? hojeISO : (diasComEvento.find(d=>d>hojeISO) || null);
estado.mes = (estado.dia || diasComEvento[0] || hojeISO).slice(0,7);

function passaFiltros(e){
  if(estado.tiposOff.has(e.tipo)) return false;
  if(estado.statusOff.has(e.status)) return false;
  if(estado.soPatrus && !e.patrus) return false;
  if(estado.frente && !e.frentes.includes(estado.frente)) return false;
  return true;
}
const filtrados = () => EVENTOS.filter(passaFiltros);
const doPeriodo = () => filtrados().filter(e=> !estado.dia || e.data===estado.dia);

/* ---------- Mapa ---------- */
const map = L.map('map',{zoomControl:true}).setView(BH,11);
// crédito da autoria no canto de atribuição, antes das fontes do mapa
map.attributionControl.setPrefix('<span class="credito">Mapa por <a href="https://www.linkedin.com/in/larissadinizaguiar/" target="_blank" rel="noopener">Larissa Diniz Aguiar</a></span> | <a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; Esri', maxZoom:16
}).addTo(map);
map.createPane('rotulos'); map.getPane('rotulos').style.zIndex=250; map.getPane('rotulos').style.pointerEvents='none';
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,pane:'rotulos'}).addTo(map);
const camadaMG = L.geoJSON(MG,{style:{color:'#A50E13',weight:1.6,opacity:.55,fill:false},interactive:false}).addTo(map);
const camadaPins = L.layerGroup().addTo(map);

const chave = e => `${e.lat.toFixed(4)},${e.lng.toFixed(4)}`;
function agrupar(lista){
  const g = new Map();
  lista.filter(e=>e.lat!=null).forEach(e=>{
    const k=chave(e); if(!g.has(k)) g.set(k,[]); g.get(k).push(e);
  });
  return g;
}

function iconePonto(evs, selecionado){
  const patrus = evs.some(e=>e.patrus);
  const tipo = ORDEM_TIPO.find(t=>evs.some(e=>e.tipo===t));
  const passado = evs.every(e=>e.status==='Realizada');
  const pendente = evs.some(e=>e.status==='Pendente de confirmação');
  const cls = ['pin', patrus&&'patrus', passado&&'passado', pendente&&'pendente', selecionado&&'sel'].filter(Boolean).join(' ');
  const miolo = patrus ? '13' : (evs.length>1 ? evs.length : '');
  const badge = (patrus && evs.length>1) ? `<span class="n">${evs.length}</span>` : '';
  const tam = patrus ? 32 : 22;
  return L.divIcon({className:'pin-wrap',iconSize:[tam,tam],iconAnchor:[tam/2,tam/2],
    html:`<div class="${cls}" style="--c:${TIPOS[tipo]};position:relative">${miolo}${badge}</div>`});
}

let grupos = new Map();
function desenharMapa(){
  camadaPins.clearLayers();
  grupos = agrupar(doPeriodo());
  grupos.forEach((evs,k)=>{
    const e0=evs[0];
    const m = L.marker([e0.lat,e0.lng],{icon:iconePonto(evs,k===estado.cardChave),keyboard:true,
      title:evs.length>1?`${e0.local} (${evs.length} atividades)`:e0.atividade,
      zIndexOffset: evs.some(e=>e.patrus)?1000:0});
    m.on('click',()=>abrirCard(k));
    m.addTo(camadaPins);
  });
  desenharForaBH();
}

// Agendas longe da capital viram atalhos no canto do mapa
function desenharForaBH(){
  const box=$('foraBH');
  const longe=[...grupos.entries()].filter(([k,evs])=>distKm(BH,[evs[0].lat,evs[0].lng])>45);
  if(!longe.length){ box.className=''; box.innerHTML=''; return; }
  box.innerHTML=`<strong>${estado.dia?'Fora da Grande BH neste dia':'Fora da Grande BH'}</strong>`+
    longe.map(([k,evs])=>{
      const cor=TIPOS[ORDEM_TIPO.find(t=>evs.some(e=>e.tipo===t))];
      const txt=estado.dia? evs[0].municipio : `${evs[0].municipio}, ${fmtDia(evs[0].data,{day:'numeric',month:'numeric'})}`;
      return `<button data-k="${k}"><span class="bola" style="background:${cor}"></span>${esc(txt)}</button>`;
    }).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ abrirCard(b.dataset.k,null,true); });
  box.className='on';
}

function enquadrar(){
  const pts=[...grupos.values()].map(evs=>[evs[0].lat,evs[0].lng]);
  if(!pts.length) return;
  const perto=pts.filter(p=>distKm(BH,p)<=45);
  const alvo = perto.length ? perto : pts;
  if(alvo.length===1) map.setView(alvo[0], perto.length?14:10);
  else map.fitBounds(alvo,{padding:[40,40],maxZoom:14});
}

/* ---------- Card ---------- */
function linkMapa(e){
  const q = e.lat!=null && e.precisao==='endereco' ? `${e.lat},${e.lng}` : `${e.local}, ${e.municipio||'Belo Horizonte'}, MG`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
}
function tagsEvento(e){
  return [
    e.patrus?'<span class="tag patrus">Com o Patrus</span>':'',
    `<span class="tag tipo" style="background:${TIPOS[e.tipo]}">${esc(e.tipo)}</span>`,
    e.status==='Pendente de confirmação'?'<span class="tag pendente">A confirmar</span>':
    e.status==='Realizada'?'<span class="tag realizada">Realizada</span>':'',
    e.diaD?'<span class="tag">Dia D</span>':'',
    e.lat==null?'<span class="tag semlocal">Local a definir</span>':''
  ].join('');
}
function blocoEvento(e, mostrarData){
  const quando = [mostrarData?fmtDia(e.data,{weekday:'short',day:'numeric',month:'short'}):'', e.hora||'Horário a definir'].filter(Boolean).join(', ');
  return `<section class="card-ev${e.id===estado.eventoFoco?' foco':''}" id="card-ev-${e.id}">
    <div class="quando">${esc(quando)}</div>
    <h3>${esc(e.atividade)}</h3>
    <div class="ev-tags">${tagsEvento(e)}</div>
    <dl>
      ${e.frentes.length?`<dt>Frente</dt><dd>${esc(e.frentes.join(', '))}</dd>`:''}
      <dt>Local</dt><dd>${esc(e.local||'A definir')}</dd>
      ${e.responsavel?`<dt>Responsável</dt><dd>${esc(e.responsavel)}</dd>`:''}
      ${e.obs?`<dt>Observações</dt><dd>${esc(e.obs)}</dd>`:''}
      <dt>Situação</dt><dd>${esc(e.status)}</dd>
    </dl>
  </section>`;
}
function abrirCard(k, idEvento=null, voar=false){
  estado.cardChave=k; estado.eventoFoco=idEvento;
  const evs = k.startsWith('sem-') ? EVENTOS.filter(e=>e.id===+k.slice(4)) : (grupos.get(k)||[]);
  if(!evs.length){ fecharCard(); return; }
  const e0=evs[0], multiDias = new Set(evs.map(e=>e.data)).size>1 || !estado.dia;
  const titulo = e0.lat==null ? e0.atividade : (e0.precisao==='cidade' ? e0.municipio : e0.local);
  const sub = e0.lat==null ? 'Local ainda não definido' :
              [e0.municipio!==titulo?e0.municipio:'Visita ao município', evs.length>1?`${evs.length} atividades neste ponto`:''].filter(Boolean).join(', ');
  const c=$('card');
  c.innerHTML=`<header class="card-topo"><h2>${esc(titulo)}</h2><p>${esc(sub)}</p>
      <button class="card-fechar" aria-label="Fechar">×</button></header>
    ${evs.map(e=>blocoEvento(e,multiDias)).join('')}
    <footer class="card-pe">${NOTA_PRECISAO[e0.precisao]?esc(NOTA_PRECISAO[e0.precisao])+' ':''}
      ${e0.local?`<a href="${linkMapa(e0)}" target="_blank" rel="noopener">Abrir no Google Maps</a>`:''}</footer>`;
  c.querySelector('.card-fechar').onclick=fecharCard;
  c.className='on'; c.scrollTop=0;
  if(idEvento!=null){ const alvo=$('card-ev-'+idEvento); if(alvo) alvo.scrollIntoView({block:'nearest'}); }
  if(voar && e0.lat!=null) map.flyTo([e0.lat,e0.lng], e0.precisao==='cidade'?10:15, {duration:.6});
  desenharMapa(); marcarLista();
}
function fecharCard(){
  estado.cardChave=null; estado.eventoFoco=null;
  $('card').className=''; $('card').innerHTML='';
  desenharMapa(); marcarLista();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && estado.cardChave) fecharCard(); });

/* ---------- Calendário ---------- */
function desenharCalendario(){
  const [ano,mes]=estado.mes.split('-').map(Number);
  const primeiro=new Date(ano,mes-1,1), nDias=new Date(ano,mes,0).getDate();
  $('mesNome').textContent=primeiro.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());
  const cont={}, comPatrus=new Set();
  filtrados().forEach(e=>{ cont[e.data]=(cont[e.data]||0)+1; if(e.patrus) comPatrus.add(e.data); });
  const g=$('calGrid'); g.innerHTML='';
  ['D','S','T','Q','Q','S','S'].forEach(s=>{const d=document.createElement('div');d.className='cal-sem';d.textContent=s;d.setAttribute('aria-hidden','true');g.appendChild(d);});
  for(let i=0;i<primeiro.getDay();i++){const d=document.createElement('div');d.className='dia vazio';g.appendChild(d);}
  for(let dia=1;dia<=nDias;dia++){
    const iso=`${ano}-${String(mes).padStart(2,'0')}-${String(dia).padStart(2,'0')}`;
    const b=document.createElement('button'); b.className='dia';
    const n=cont[iso]||0;
    b.innerHTML=`${dia}${n?`<span class="qtd">${n}</span>`:''}${comPatrus.has(iso)?'<span class="estrela" aria-hidden="true">★</span>':''}`;
    if(n){ b.classList.add('tem'); b.onclick=()=>selecionarDia(iso);
           b.setAttribute('aria-label',`${fmtDia(iso,{day:'numeric',month:'long'})}, ${n} atividade${n>1?'s':''}${comPatrus.has(iso)?', com agenda do Patrus':''}`); }
    else { b.disabled=true; b.setAttribute('aria-label',`${dia}, sem atividades`); }
    if(iso===hojeISO) b.classList.add('hoje');
    if(iso===estado.dia){ b.classList.add('sel'); b.setAttribute('aria-pressed','true'); }
    g.appendChild(b);
  }
  // setas só avançam até meses com agenda
  const meses=[...new Set(diasComEvento.map(d=>d.slice(0,7)))];
  $('mesAnt').disabled = !meses.some(m=>m<estado.mes);
  $('mesProx').disabled = !meses.some(m=>m>estado.mes);
  $('btnTodos').setAttribute('aria-pressed', estado.dia?'false':'true');
}
function mudarMes(passo){
  const meses=[...new Set(diasComEvento.map(d=>d.slice(0,7)))];
  const alvo = passo<0 ? meses.filter(m=>m<estado.mes).pop() : meses.find(m=>m>estado.mes);
  if(alvo){ estado.mes=alvo; desenharCalendario(); }
}
function selecionarDia(iso){
  estado.dia = (estado.dia===iso) ? null : iso;
  if(estado.dia) estado.mes=estado.dia.slice(0,7);
  fecharCardSilencioso(); atualizar(true);
}
function fecharCardSilencioso(){ estado.cardChave=null; estado.eventoFoco=null; $('card').className=''; $('card').innerHTML=''; }

/* ---------- Lista ---------- */
function desenharLista(){
  const evs=doPeriodo(), ul=$('lista');
  const nPatrus=evs.filter(e=>e.patrus).length, nSemLocal=evs.filter(e=>e.lat==null).length;
  $('listaTitulo').textContent = estado.dia ? fmtDia(estado.dia,{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()) : 'Todos os dias';
  $('listaResumo').textContent = evs.length
    ? `${evs.length} atividade${evs.length>1?'s':''}${nPatrus?`, ${nPatrus} com o Patrus`:''}${nSemLocal?`, ${nSemLocal} com local a definir`:''}`
    : '';
  if(!evs.length){
    ul.innerHTML=`<li class="vazio-msg">Nenhuma atividade com esses filtros${estado.dia?' neste dia':''}. Escolha outro dia no calendário ou use Limpar filtros.</li>`;
    return;
  }
  let html='', diaAtual=null;
  evs.forEach(e=>{
    if(!estado.dia && e.data!==diaAtual){ diaAtual=e.data;
      html+=`<li class="grupo-dia">${esc(fmtDia(e.data,{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase()))}</li>`; }
    const [h1,h2]=(e.hora||'').split('-');
    html+=`<li class="ev" data-id="${e.id}" tabindex="0">
      <div class="ev-hora">${esc(h1||'--')}${h2?`<small>até ${esc(h2)}</small>`:''}</div>
      <div><div class="ev-titulo">${esc(e.atividade)}</div>
        <div class="ev-local">${esc(e.local||'Local a definir')}${e.municipio&&e.municipio!=='Belo Horizonte'&&e.municipio!==e.local?`, ${esc(e.municipio)}`:''}</div>
        <div class="ev-tags">${tagsEvento(e)}</div></div>
    </li>`;
  });
  ul.innerHTML=html;
  ul.querySelectorAll('.ev').forEach(li=>{
    const ir=()=>{ const e=EVENTOS.find(x=>x.id===+li.dataset.id);
      abrirCard(e.lat!=null?chave(e):'sem-'+e.id, e.id, true); };
    li.onclick=ir; li.onkeydown=ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); ir(); } };
  });
  marcarLista();
}
function marcarLista(){
  document.querySelectorAll('#lista .ev').forEach(li=>{
    const e=EVENTOS.find(x=>x.id===+li.dataset.id);
    const k=e.lat!=null?chave(e):'sem-'+e.id;
    li.classList.toggle('ativo', k===estado.cardChave);
  });
}

/* ---------- Filtros ---------- */
function montarFiltros(){
  const ft=$('fTipos');
  ORDEM_TIPO.forEach(t=>{
    const n=EVENTOS.filter(e=>e.tipo===t).length;
    const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed','true');
    b.innerHTML=`<span class="bola" style="background:${TIPOS[t]}"></span>${esc(t)} (${n})`;
    b.onclick=()=>{ estado.tiposOff.has(t)?estado.tiposOff.delete(t):estado.tiposOff.add(t);
      b.setAttribute('aria-pressed', estado.tiposOff.has(t)?'false':'true'); atualizar(false); };
    ft.appendChild(b);
  });
  const fs=$('fStatus');
  STATUS.filter(s=>EVENTOS.some(e=>e.status===s)).forEach(s=>{
    const b=document.createElement('button'); b.className='chip status'; b.setAttribute('aria-pressed','true');
    b.textContent=s;
    b.onclick=()=>{ estado.statusOff.has(s)?estado.statusOff.delete(s):estado.statusOff.add(s);
      b.setAttribute('aria-pressed', estado.statusOff.has(s)?'false':'true'); atualizar(false); };
    fs.appendChild(b);
  });
  const cont={}; EVENTOS.forEach(e=>e.frentes.forEach(f=>cont[f]=(cont[f]||0)+1));
  Object.keys(cont).sort((a,b)=>a.localeCompare(b)).forEach(f=>{
    const o=document.createElement('option'); o.value=f; o.textContent=`${f} (${cont[f]})`; $('fFrente').appendChild(o);
  });
  $('fFrente').onchange=e=>{ estado.frente=e.target.value; atualizar(false); };
  $('soPatrus').onchange=e=>{ estado.soPatrus=e.target.checked; atualizar(true); };
  $('btnTodos').onclick=()=>{ estado.dia=null; fecharCardSilencioso(); atualizar(true); };
  $('mesAnt').onclick=()=>mudarMes(-1); $('mesProx').onclick=()=>mudarMes(1);
  $('verBH').onclick=()=>map.setView(BH,12);
  $('verMG').onclick=()=>map.fitBounds(camadaMG.getBounds(),{padding:[10,10]});
  $('limpar').onclick=()=>{
    estado.tiposOff.clear(); estado.statusOff.clear(); estado.soPatrus=false; estado.frente='';
    $('soPatrus').checked=false; $('fFrente').value='';
    document.querySelectorAll('#fTipos .chip,#fStatus .chip').forEach(c=>c.setAttribute('aria-pressed','true'));
    fecharCardSilencioso(); atualizar(true);
  };
}

function atualizar(reenquadrar){
  // se o card aberto ficou sem eventos visíveis, fecha
  desenharCalendario(); desenharMapa(); desenharLista();
  if(estado.cardChave && !estado.cardChave.startsWith('sem-') && !grupos.has(estado.cardChave)) fecharCardSilencioso();
  if(reenquadrar) enquadrar();
}

// no celular os filtros começam recolhidos para o mapa aparecer mais cedo
if(window.matchMedia('(max-width:820px)').matches) $('filtrosBox').removeAttribute('open');

montarFiltros();
atualizar(true);
</script>
